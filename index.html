<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>食事処えん</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1a1208;--ink-sub:#6b5e4e;--ink-hint:#b0a090;
  --paper:#f7f4ef;--surface:#ffffff;--surface2:#faf8f4;
  --verm:#b5352a;--verm-bg:#fdf0ee;--verm-bd:#dda090;
  --moss:#3a6644;--moss-bg:#edf4ee;--moss-bd:#8aba94;
  --gold:#8a6010;--gold-bg:#fdf6e3;--gold-bd:#d4a84b;
  --indigo:#2c3e6b;--indigo-bg:#eef0f8;--indigo-bd:#8d9fd4;
  --border:rgba(26,18,8,0.09);--border-md:rgba(26,18,8,0.18);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --serif:'Noto Serif JP',serif;--sans:'Noto Sans JP',sans-serif;
  --shadow:0 2px 8px rgba(26,18,8,0.07);
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:430px;margin:0 auto;padding-bottom:80px;}

/* HEADER */
.header{background:var(--ink);padding:24px 20px 20px;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;border:1px solid rgba(255,255,255,0.06);border-radius:50%;}
.header::after{content:'';position:absolute;top:10px;right:10px;width:70px;height:70px;border:1px solid rgba(255,255,255,0.04);border-radius:50%;}
.header-en{font-size:9px;letter-spacing:0.25em;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-bottom:6px;}
.header-ja{font-family:var(--serif);font-size:26px;color:#fff;font-weight:400;letter-spacing:0.12em;}
.header-kamon{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:44px;height:44px;opacity:0.12;}
.header-accent{width:24px;height:1px;background:var(--verm);margin-top:12px;opacity:0.8;}

/* PROFILE BAR */
.profile-bar{display:none;align-items:center;gap:10px;background:var(--surface);padding:12px 16px;border-bottom:1px solid var(--border);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--moss-bg);border:1.5px solid var(--moss-bd);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--moss);flex-shrink:0;overflow:hidden;}
.avatar img{width:36px;height:36px;object-fit:cover;border-radius:50%;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-sub{font-size:10px;color:var(--ink-hint);margin-top:1px;}
.profile-actions{display:flex;gap:6px;flex-shrink:0;}
.pill-btn{font-size:11px;font-weight:500;padding:5px 11px;border-radius:20px;border:1px solid var(--border-md);background:var(--surface);color:var(--ink-sub);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.pill-btn.admin-login{border-color:var(--verm);color:var(--verm);}
.pill-btn.admin-panel{background:var(--ink);color:#fff;border-color:var(--ink);}
.pill-btn.logout{color:var(--ink-hint);}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* ===== ログイン画面 ===== */
.login-wrap{padding:40px 20px;}
.login-kamon{font-size:40px;text-align:center;margin-bottom:16px;opacity:0.25;}
.login-title{font-family:var(--serif);font-size:22px;font-weight:400;margin-bottom:6px;text-align:center;letter-spacing:0.1em;}
.login-sub{font-size:13px;color:var(--ink-sub);margin-bottom:28px;text-align:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-sub);letter-spacing:0.05em;margin-bottom:5px;}
input[type=text],input[type=password],input[type=date],input[type=number],select{width:100%;font-family:var(--sans);font-size:14px;border:1px solid var(--border-md);border-radius:var(--radius-sm);padding:10px 13px;background:var(--surface);color:var(--ink);outline:none;appearance:none;transition:border-color 0.15s,box-shadow 0.15s;}
input:focus,select:focus{border-color:var(--verm);box-shadow:0 0 0 3px rgba(181,53,42,0.08);}

/* ===== 主催者選択画面 ===== */
.host-grid{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.host-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:12px;}
.host-card:hover{border-color:var(--verm-bd);background:var(--verm-bg);}
.host-icon{width:40px;height:40px;border-radius:50%;background:var(--verm-bg);border:1.5px solid var(--verm-bd);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--verm);flex-shrink:0;}
.host-name{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:0.06em;}
.host-count{font-size:11px;color:var(--ink-hint);margin-top:2px;}

/* ===== イベント一覧 (user) ===== */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;}
.tab-btn{flex:1;padding:13px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-hint);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:0.04em;transition:all 0.15s;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--verm);}
.page-header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.page-header-title{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:0.06em;}
.back-btn{font-size:11px;padding:5px 12px;border:1px solid var(--border-md);border-radius:20px;background:var(--surface);color:var(--ink-sub);cursor:pointer;white-space:nowrap;}

/* EVENT CARDS */
.ev-list{padding:18px 16px;}
.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);position:relative;}
.ev-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--moss);}
.ev-card.expired::before{background:var(--ink-hint);}
.ev-card-header{padding:16px 16px 14px 20px;border-bottom:1px solid var(--border);}
.ev-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.ev-card-name{font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:0.08em;}
.ev-card-info{margin-top:0;}
.ev-card-info-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ev-card-info-row:last-child{margin-bottom:0;}
.ev-card-info-label{font-size:10px;font-weight:600;color:var(--ink-hint);letter-spacing:0.08em;width:52px;flex-shrink:0;}
.ev-card-info-val{font-size:13px;color:var(--ink-sub);}
.ev-card-info-val.urgent{color:var(--verm);font-weight:600;}
.ev-card-info-val.urgent::after{content:' ⚠ 期限間近';font-size:10px;font-weight:500;}
.ev-card-body{padding:14px 16px 14px 20px;}

/* ANSWER */
.answer-section{margin-bottom:0;}
.section-label{font-size:11px;font-weight:600;color:var(--ink-sub);letter-spacing:0.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.answer-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.answer-btn{padding:12px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--ink-sub);transition:all 0.15s;}
.answer-btn.sel-attend{background:var(--moss-bg);border-color:var(--moss-bd);color:var(--moss);}
.answer-btn.sel-absent{background:var(--verm-bg);border-color:var(--verm-bd);color:var(--verm);}
.answer-btn.sel-pending{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold);}
.divider-row{height:1px;background:var(--border);margin:12px 0;}
.bottle-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bottle-btn{padding:11px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--ink-sub);transition:all 0.15s;line-height:1.4;}
.bottle-btn small{display:block;font-size:10px;color:var(--ink-hint);margin-top:2px;}
.bottle-btn.sel-bring{background:var(--moss-bg);border-color:var(--moss-bd);color:var(--moss);}
.bottle-btn.sel-nobring{background:var(--indigo-bg);border-color:var(--indigo-bd);color:var(--indigo);}
.submit-area{margin-top:14px;}
.btn-submit{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--ink);color:#fff;border:none;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:0.06em;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-submit:active{opacity:0.75;}
.btn-submit:disabled{background:var(--ink-hint);cursor:not-allowed;}
.btn-submit.done{background:var(--moss);}
.expired-notice{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--ink-hint);margin-bottom:10px;text-align:center;border:1px solid var(--border);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.03em;}
.badge-open{background:var(--moss-bg);color:var(--moss);}
.badge-expired{background:var(--surface2);color:var(--ink-hint);border:1px solid var(--border);}
.badge-attend{background:var(--moss-bg);color:var(--moss);}
.badge-absent{background:var(--verm-bg);color:var(--verm);}
.badge-pending{background:var(--gold-bg);color:var(--gold);}
.badge-bring{background:var(--moss-bg);color:var(--moss);}
.badge-nobring{background:var(--indigo-bg);color:var(--indigo);}

/* ===== 管理者画面 ===== */
.admin-wrap{padding:18px 16px;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);}
.stat-label{font-size:10px;color:var(--ink-hint);margin-bottom:6px;letter-spacing:0.04em;}
.stat-val{font-size:24px;font-weight:600;font-family:var(--serif);}
.stat-val.g{color:var(--moss);}.stat-val.r{color:var(--verm);}.stat-val.a{color:var(--gold);}.stat-val.b{color:var(--indigo);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-hint);margin-bottom:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-md);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink);transition:opacity 0.15s;}
.btn:active{opacity:0.7;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-verm{background:var(--verm);color:#fff;border-color:var(--verm);}
.btn-moss{background:var(--moss-bg);color:var(--moss);border-color:var(--moss-bd);}
.btn-danger{background:var(--verm-bg);color:var(--verm);border-color:var(--verm-bd);}
.btn-sm{padding:5px 12px;font-size:12px;width:auto;border-radius:var(--radius-xs);}
.admin-ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
.admin-ev-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.admin-ev-name{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:0.06em;}
.admin-ev-meta{font-size:11px;color:var(--ink-sub);margin-top:3px;}
.admin-ev-stats{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface2);}
.admin-ev-stat{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--border);}
.admin-ev-stat:last-child{border-right:none;}
.admin-ev-stat-label{font-size:9px;color:var(--ink-hint);margin-bottom:3px;}
.admin-ev-stat-val{font-size:15px;font-weight:600;font-family:var(--serif);}
.member-list{padding:0 16px;}
.member-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.member-row:last-child{border-bottom:none;}
.member-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-ev-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface2);}

/* スーパー管理者 */
.super-section{margin-top:8px;border-top:1px solid var(--border);padding-top:16px;}
.admin-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.admin-list-item:last-child{border-bottom:none;}
.admin-list-name{flex:1;font-size:14px;font-weight:500;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,0.55);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:28px 24px 44px;width:100%;max-width:430px;}
.modal-title{font-family:var(--serif);font-size:17px;font-weight:400;margin-bottom:6px;letter-spacing:0.06em;}
.modal-sub{font-size:13px;color:var(--ink-sub);margin-bottom:20px;}
.modal-close{float:right;font-size:20px;border:none;background:none;color:var(--ink-hint);cursor:pointer;margin-top:-4px;}

/* MISC */
.loading{text-align:center;padding:48px 20px;color:var(--ink-hint);font-size:14px;}
.spinner{width:22px;height:22px;border:2px solid var(--border-md);border-top-color:var(--verm);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:32px 20px;color:var(--ink-hint);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:0.4;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.err-msg{background:var(--verm-bg);border:1px solid var(--verm-bd);border-radius:var(--radius-xs);padding:8px 12px;font-size:12px;color:var(--verm);margin-bottom:10px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-en">Shokujidokoro</div>
    <div class="header-ja">食事処 えん</div>
    <svg class="header-kamon" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="45" stroke="white" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="35" stroke="white" stroke-width="1"/>
      <circle cx="50" cy="50" r="5" fill="white"/>
      <line x1="50" y1="5" x2="50" y2="95" stroke="white" stroke-width="1"/>
      <line x1="5" y1="50" x2="95" y2="50" stroke="white" stroke-width="1"/>
      <line x1="18" y1="18" x2="82" y2="82" stroke="white" stroke-width="1"/>
      <line x1="82" y1="18" x2="18" y2="82" stroke="white" stroke-width="1"/>
    </svg>
    <div class="header-accent"></div>
  </div>

  <div class="profile-bar" id="profile-bar">
    <div class="avatar" id="avatar-el">？</div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-sub" id="profile-sub">LINE でログイン済み</div>
    </div>
    <div class="profile-actions" id="profile-actions"></div>
  </div>

  <!-- P1: LINEログイン -->
  <div class="page active" id="page-login">
    <div class="login-wrap">
      
      <div class="login-title">食事処 えん</div>
      <div class="login-sub">お名前を入力してご参加ください</div>
      <div class="field"><input type="text" id="demo-name" placeholder="例：山田 太郎"/></div>
      <button class="btn btn-primary" onclick="demoLogin()">参加する</button>
      <button class="btn" onclick="openAdminModal()" style="margin-top:8px;">管理者としてログイン</button>
    </div>
  </div>

  <!-- P2: 主催者選択 -->
  <div class="page" id="page-host">
    <div class="page-header">
      <div class="page-header-title">主催者を選んでください</div>
    </div>
    <div style="padding:16px;">
      <div id="host-list"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
    </div>
  </div>

  <!-- P3: イベント一覧 (user) -->
  <div class="page" id="page-events">
    <div class="page-header">
      <button class="back-btn" onclick="showPage('host')">← 主催者に戻る</button>
      <div class="page-header-title" id="host-title"></div>
    </div>
    <div class="tab-bar">
      <div class="tab-btn active" id="tab-open" onclick="switchUserTab('open')">受付中</div>
      <div class="tab-btn" id="tab-all"  onclick="switchUserTab('all')">すべて</div>
    </div>
    <div class="ev-list" id="ev-list">
      <div class="loading"><div class="spinner"></div>読み込み中...</div>
    </div>
  </div>

  <!-- P4: 管理者画面 -->
  <div class="page" id="page-admin">
    <div class="page-header">
      <button class="back-btn" onclick="adminBack()">← 戻る</button>
      <div class="page-header-title" id="admin-title">管理者画面</div>
    </div>
    <div class="admin-wrap" id="admin-content">
      <div class="loading"><div class="spinner"></div>読み込み中...</div>
    </div>
  </div>
</div>

<!-- 管理者ログインモーダル -->
<div class="modal-overlay" id="admin-modal" onclick="closeAdminModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeAdminModal()">✕</button>
    <div class="modal-title">管理者ログイン</div>
    <div class="modal-sub">主催者名とパスワードを入力してください</div>
    <div id="admin-modal-err"></div>
    <div class="field"><label>主催者名</label><input type="text" id="admin-name-inp" placeholder="例：北澤 諒"/></div>
    <div class="field"><label>パスワード</label><input type="password" id="pw-inp" placeholder="パスワード" onkeydown="if(event.key==='Enter')checkAdminPw()"/></div>
    <button class="btn btn-primary" onclick="checkAdminPw()">ログイン</button>
    <div style="margin-top:12px;text-align:center;">
      <span style="font-size:11px;color:var(--ink-hint);cursor:pointer;" onclick="openSuperModal()">スーパー管理者としてログイン</span>
    </div>
  </div>
</div>

<!-- スーパー管理者モーダル -->
<div class="modal-overlay" id="super-modal" onclick="closeSuperModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeSuperModal()">✕</button>
    <div class="modal-title">スーパー管理者</div>
    <div class="modal-sub">マスターパスワードを入力してください</div>
    <div id="super-modal-err"></div>
    <div class="field"><input type="password" id="super-pw-inp" placeholder="マスターパスワード" onkeydown="if(event.key==='Enter')checkSuperPw()"/></div>
    <button class="btn btn-primary" onclick="checkSuperPw()">ログイン</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL        = 'https://script.google.com/macros/s/AKfycbwc9LAnpq7ryTeMVrOTCFbFC_yLLEKqoMsAn4TEffoanltGKhrsWekFfwmQXSbq1FsY_Q/exec';
const LIFF_ID        = '2009962315-GErGmtBd';
const SUPER_PW_LOCAL = 'adminpass'; // スーパー管理者PW（GAS側と一致させること）
const PRICE_BRING    = 2500;
const PRICE_NOBRING  = 4500;

let lineProfile    = null;
let isLiffEnv      = false;
let admins         = []; // [{id,name}]
let selectedHost   = null; // {id,name}
let events         = [];
let userTab        = 'open';
let currentAdmin   = null; // ログイン中の管理者 {id,name}
let isSuperAdmin   = false;

// =====================================================================
// 初期化
// =====================================================================
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    isLiffEnv = true;
    const profile = await liff.getProfile();
    lineProfile = profile;
    showProfile(profile);
    await loadAdmins();
    showPage('host');
    renderHostList();
  } catch(err) {
    console.warn('LIFF failed:', err.message);
    showPage('login');
  }
}

function showProfile(p) {
  document.getElementById('profile-bar').style.display = 'flex';
  const av = document.getElementById('avatar-el');
  av.innerHTML = p.pictureUrl ? `<img src="${p.pictureUrl}" alt=""/>` : esc(p.displayName.slice(0,2));
  document.getElementById('profile-name').textContent = p.displayName;
  renderProfileActions();
}

function renderProfileActions() {
  const el = document.getElementById('profile-actions');
  if (currentAdmin || isSuperAdmin) {
    const label = isSuperAdmin ? 'スーパー管理者' : currentAdmin.name;
    el.innerHTML = `
      <button class="pill-btn admin-panel" onclick="showPage('admin')">${label}</button>
      <button class="pill-btn logout" onclick="adminLogout()">ログアウト</button>`;
  } else {
    el.innerHTML = `<button class="pill-btn admin-login" onclick="openAdminModal()">管理者としてログイン</button>`;
  }
}

// =====================================================================
// ユーティリティ
// =====================================================================
function formatDate(val) {
  if (!val) return '未設定';
  // "2026-05-22T15:00:00.000Z" → "2026-05-22"
  return String(val).slice(0, 10);
}

// =====================================================================
// API
// =====================================================================
async function api(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${GAS_URL}?${qs}`, { method: 'GET' });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

async function loadAdmins() {
  try {
    admins = await api({ action: 'getAdmins' });
  } catch(e) { admins = []; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

// デモログイン
// =====================================================================
function demoLogin() {
  const name = document.getElementById('demo-name').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  lineProfile = { userId: 'demo-' + encodeURIComponent(name), displayName: name, pictureUrl: null };
  showProfile(lineProfile);
  loadAdmins().then(() => { showPage('host'); renderHostList(); });

// 主催者選択
// =====================================================================
async function renderHostList() {
  const el = document.getElementById('host-list');
  if (!admins.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🌸</div>主催者がまだいません</div>';
    return;
  }
  // 各主催者のイベント数を取得
  let html = '<div class="host-grid">';
  for (const a of admins) {
    let evCount = 0;
    try {
      const evs = await api({ action: 'getEvents', adminId: a.id });
      evCount = Array.isArray(evs) ? evs.length : 0;
    } catch(e) {}
    html += `<div class="host-card" onclick="selectHost('${a.id}','${esc(a.name)}')">
      <div class="host-icon">${esc(a.name.slice(0,1))}</div>
      <div>
        <div class="host-name">${esc(a.name)}</div>
        <div class="host-count">イベント ${evCount}件</div>
      </div>
      <span style="color:var(--ink-hint);font-size:18px;margin-left:auto;">›</span>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

async function selectHost(id, name) {
  selectedHost = { id, name };
  document.getElementById('host-title').textContent = name;
  showPage('events');
  await loadHostEvents();
  renderEventList();
}

async function loadHostEvents() {
  try {
    const data = await api({ action: 'getEvents', adminId: selectedHost.id });
    events = Array.isArray(data) ? data : [];
  } catch(e) { events = []; }
}

function switchUserTab(tab) {
  userTab = tab;
  document.getElementById('tab-open').classList.toggle('active', tab==='open');
  document.getElementById('tab-all').classList.toggle('active', tab==='all');
  renderEventList();
}

async function renderEventList() {
  const el = document.getElementById('ev-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const today = new Date().toISOString().split('T')[0];
  const filtered = userTab === 'open'
    ? events.filter(ev => !ev.deadline || ev.deadline >= today)
    : events;

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🌸</div>${userTab==='open'?'受付中のイベントはありません':'イベントがありません'}</div>`;
    return;
  }

  let html = '';
  for (const ev of filtered) {
    const expired = ev.deadline && ev.deadline < today;
    const members = await loadMembers(ev.id);
    const me = members.find(m => String(m.lineUserId) === String(lineProfile.userId));
    const myStatus = me ? me.status : '';
    const myBottle = me ? me.note   : '';
    const isAnswered = myStatus && myBottle;

    // 期限まで何日か計算
    const deadlineDate = ev.deadline ? new Date(ev.deadline) : null;
    const todayDate = new Date(today);
    const diffDays = deadlineDate ? Math.ceil((deadlineDate - todayDate) / (1000*60*60*24)) : null;
    const isUrgent = !expired && diffDays !== null && diffDays <= 2 && diffDays >= 0;

    html += `<div class="ev-card ${expired?'expired':''}">
      <div class="ev-card-header">
        <div class="ev-card-top">
          <div class="ev-card-name">${esc(ev.name)}</div>
          <span class="badge ${expired?'badge-expired':'badge-open'}">${expired?'受付終了':'受付中'}</span>
        </div>
        <div class="ev-card-info">
          <div class="ev-card-info-row">
            <span class="ev-card-info-label">開催日</span>
            <span class="ev-card-info-val">${formatDate(ev.date)}</span>
          </div>
          <div class="ev-card-info-row">
            <span class="ev-card-info-label">回答期限</span>
            <span class="ev-card-info-val ${isUrgent?'urgent':''}">${formatDate(ev.deadline)}${isUrgent?' ⚠ 期限間近':''}</span>
          </div>
        </div>
      </div>
      <div class="ev-card-body">`;

    if (expired) {
      const sLabel = myStatus==='attend'?'参加予定':myStatus==='absent'?'不参加':'未回答';
      const bLabel = myBottle==='bring'?'ボトル持込あり':myBottle==='nobring'?'持込なし':'―';
      html += `<div class="expired-notice">回答受付は終了しています</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="badge badge-${myStatus||'pending'}">${sLabel}</span>
          ${myBottle?`<span class="badge ${myBottle==='bring'?'badge-bring':'badge-nobring'}">${bLabel}</span>`:''}
        </div>`;
    } else {
      html += `
      <div class="answer-section">
        <div class="section-label">📋 出欠を回答する</div>
        <div class="answer-btns" id="ans-${ev.id}">
          <button class="answer-btn ${myStatus==='attend'?'sel-attend':''}" onclick="selectAnswer('${ev.id}','attend',this)">参加する</button>
          <button class="answer-btn ${myStatus==='absent'?'sel-absent':''}" onclick="selectAnswer('${ev.id}','absent',this)">不参加</button>
          <button class="answer-btn ${(!myStatus||myStatus==='pending')?'sel-pending':''}" onclick="selectAnswer('${ev.id}','pending',this)">未定</button>
        </div>
      </div>
      <div class="divider-row"></div>
      <div>
        <div class="section-label">🍾 ボトル持ち込み</div>
        <div class="bottle-opts" id="bot-${ev.id}">
          <button class="bottle-btn ${myBottle==='bring'?'sel-bring':''}" onclick="selectBottle('${ev.id}','bring',this)">
            持ち込む<small>¥${PRICE_BRING.toLocaleString()}</small>
          </button>
          <button class="bottle-btn ${myBottle==='nobring'?'sel-nobring':''}" onclick="selectBottle('${ev.id}','nobring',this)">
            持ち込まない<small>¥${PRICE_NOBRING.toLocaleString()}</small>
          </button>
        </div>
      </div>
      <div class="submit-area">
        <button class="btn-submit ${isAnswered?'done':''}" id="submit-${ev.id}" onclick="submitAll('${ev.id}')">
          ${isAnswered?'回答済み ✓':'回答する'}
        </button>
      </div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

async function loadMembers(eventId) {
  try {
    const data = await api({ action:'getMembers', eventId });
    return Array.isArray(data) ? data : [];
  } catch(e) { return []; }
}

function selectAnswer(evId, status, btnEl) {
  btnEl.closest('.answer-btns').querySelectorAll('.answer-btn').forEach(b=>b.className='answer-btn');
  btnEl.classList.add('sel-'+status);
  resetSubmitBtn(evId);
}

function selectBottle(evId, bottle, btnEl) {
  btnEl.closest('.bottle-opts').querySelectorAll('.bottle-btn').forEach(b=>b.className='bottle-btn');
  btnEl.classList.add(bottle==='bring'?'sel-bring':'sel-nobring');
  resetSubmitBtn(evId);
}

function resetSubmitBtn(evId) {
  const btn = document.getElementById('submit-'+evId);
  if (btn) { btn.textContent='回答する'; btn.classList.remove('done'); btn.disabled=false; }
}

async function submitAll(evId) {
  const ansArea = document.getElementById('ans-'+evId);
  const selAns  = ansArea && ansArea.querySelector('.sel-attend,.sel-absent,.sel-pending');
  const status  = selAns ? (selAns.classList.contains('sel-attend')?'attend':selAns.classList.contains('sel-absent')?'absent':'pending') : '';
  const botArea = document.getElementById('bot-'+evId);
  const selBot  = botArea && botArea.querySelector('.sel-bring,.sel-nobring');
  const bottle  = selBot ? (selBot.classList.contains('sel-bring')?'bring':'nobring') : '';
  if (!status) { showToast('出欠を選択してください'); return; }
  if (!bottle) { showToast('ボトル持ち込みを選択してください'); return; }
  const pay = bottle === 'bring' ? PRICE_BRING : PRICE_NOBRING;
  const btn = document.getElementById('submit-'+evId);
  if (btn) { btn.textContent='送信中...'; btn.disabled=true; }
  try {
    await api({ action:'upsertMember', eventId:evId,
      lineUserId:lineProfile.userId, lineName:lineProfile.displayName,
      status, pay, note: bottle });
    if (btn) { btn.textContent='回答済み ✓'; btn.classList.add('done'); btn.disabled=false; }
    showToast('回答を送信しました ✓');
  } catch(e) {
    if (btn) { btn.textContent='回答する'; btn.disabled=false; }
    showToast('送信に失敗しました');
  }
}

  document.getElementById('admin-modal-err').innerHTML = '';

}
function closeAdminModal(e) {

  document.getElementById('admin-modal').classList.remove('open');
}
async function checkAdminPw() {
  const name = document.getElementById('admin-name-inp').value.trim();
  const pw   = document.getElementById('pw-inp').value;
  if (!name||!pw) { document.getElementById('admin-modal-err').innerHTML='<div class="err-msg">主催者名とパスワードを入力してください</div>'; return; }

    const result = await api({ action:'loginAdmin', name, password: pw });

function openSuperModal() {
  document.getElementById('admin-modal').classList.remove('open');
  document.getElementById('super-modal').classList.add('open');
  document.getElementById('super-modal-err').innerHTML = '';
  setTimeout(() => document.getElementById('super-pw-inp').focus(), 100);
}
function closeSuperModal(e) {

  document.getElementById('super-modal').classList.remove('open');
}

}

function adminLogout() {
  if (!confirm('ログアウトしますか？')) return;
  currentAdmin = null; isSuperAdmin = false;
  renderProfileActions();
  if (lineProfile) { showPage('host'); renderHostList(); }
  else showPage('login');
  showToast('ログアウトしました');
}

function adminBack() {
  if (lineProfile) { showPage('host'); renderHostList(); }
  else showPage('login');
}

// =====================================================================
// 管理者ビュー
// =====================================================================
async function renderAdminView() {
  const el = document.getElementById('admin-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';

  if (isSuperAdmin) {
    renderSuperAdminView();
    return;
  }

  // 通常管理者
  document.getElementById('admin-title').textContent = currentAdmin.name + ' の管理画面';
  const today = new Date().toISOString().split('T')[0];
  let myEvents = [];
  try {
    const data = await api({ action:'getEvents', adminId: currentAdmin.id });
    myEvents = Array.isArray(data) ? data : [];
  } catch(e) {}

  let ta=0,tb=0,tc=0,tp=0;
  for (const ev of myEvents) {
    const members = await loadMembers(ev.id);
    ev._members = members;
    members.forEach(m => {
      if (m.status==='attend') ta++; else if (m.status==='absent') tb++; else tc++;
      tp += parseInt(m.pay)||0;
    });
  }

  let html = `
    <div class="stats">
      <div class="stat"><div class="stat-label">参加（累計）</div><div class="stat-val g">${ta}</div></div>
      <div class="stat"><div class="stat-label">不参加（累計）</div><div class="stat-val r">${tb}</div></div>
      <div class="stat"><div class="stat-label">未回答（累計）</div><div class="stat-val a">${tc}</div></div>
      <div class="stat"><div class="stat-label">集金合計</div><div class="stat-val b">¥${tp.toLocaleString()}</div></div>
    </div>
    <div class="card">
      <div class="card-eyebrow">日程を追加</div>
      <div class="field"><label>イベント名</label><input type="text" id="ev-name" placeholder="例: 6月の会"/></div>
      <div class="row2">
        <div class="field"><label>開催日</label><input type="date" id="ev-date"/></div>
        <div class="field"><label>回答期限</label><input type="date" id="ev-deadline"/></div>
      </div>
      <button class="btn btn-verm" id="add-ev-btn" onclick="addEvent()">日程を追加する</button>
    </div>`;

  myEvents.forEach(ev => {
    const expired = ev.deadline && ev.deadline < today;
    const members = ev._members||[];
    const attend  = members.filter(m=>m.status==='attend').length;
    const absent  = members.filter(m=>m.status==='absent').length;
    const pending = members.filter(m=>m.status==='pending').length;
    const bring   = members.filter(m=>m.note==='bring').length;
    const nobring = members.filter(m=>m.note==='nobring').length;
    const pay     = members.reduce((s,m)=>s+(parseInt(m.pay)||0),0);

    html += `<div class="admin-ev-card">
      <div class="admin-ev-header">
        <div>
          <div class="admin-ev-name">${esc(ev.name)}</div>
          <div class="admin-ev-meta">開催: ${ev.date}　期限: ${ev.deadline||'未設定'}</div>
        </div>
        <span class="badge ${expired?'badge-expired':'badge-open'}">${expired?'期限切れ':'受付中'}</span>
      </div>
      <div class="admin-ev-stats">
        <div class="admin-ev-stat"><div class="admin-ev-stat-label">参加</div><div class="admin-ev-stat-val" style="color:var(--moss)">${attend}</div></div>
        <div class="admin-ev-stat"><div class="admin-ev-stat-label">不参加</div><div class="admin-ev-stat-val" style="color:var(--verm)">${absent}</div></div>
        <div class="admin-ev-stat"><div class="admin-ev-stat-label">🍾持込</div><div class="admin-ev-stat-val" style="color:var(--moss)">${bring}</div></div>
        <div class="admin-ev-stat"><div class="admin-ev-stat-label">持込なし</div><div class="admin-ev-stat-val" style="color:var(--indigo)">${nobring}</div></div>
        <div class="admin-ev-stat"><div class="admin-ev-stat-label">集金</div><div class="admin-ev-stat-val" style="font-size:12px;">¥${pay.toLocaleString()}</div></div>
      </div>
      <div class="member-list">`;
    if (!members.length) {
      html += '<div style="padding:14px 0;font-size:13px;color:var(--ink-hint);text-align:center;">まだ参加者がいません</div>';
    } else {
      members.forEach(m => {
        const sL = m.status==='attend'?'参加':m.status==='absent'?'不参加':'未回答';
        const bL = m.note==='bring'?'🍾持込':m.note==='nobring'?'持込なし':'―';
        html += `<div class="member-row">
          <div class="member-name">${esc(m.lineName)}</div>
          <span class="badge badge-${m.status||'pending'}">${sL}</span>
          <span style="font-size:11px;color:var(--ink-sub);flex-shrink:0;">${bL}</span>
          <span style="font-size:12px;font-weight:600;flex-shrink:0;">¥${parseInt(m.pay)||0}</span>
          <button class="btn btn-sm btn-danger" onclick="adminDeleteMember('${m.id}')">削除</button>
        </div>`;
      });
    }
    html += `</div>
      <div class="admin-ev-footer">
        <button class="btn btn-sm btn-moss" onclick="adminExportCSV('${ev.id}')">CSV出力</button>
        <button class="btn btn-sm btn-danger" onclick="adminDeleteEvent('${ev.id}')">削除</button>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

async function addEvent() {
  const name     = document.getElementById('ev-name').value.trim();
  const date     = document.getElementById('ev-date').value;
  const deadline = document.getElementById('ev-deadline').value;
  if (!name||!date) { alert('イベント名と開催日は必須です'); return; }
  const btn = document.getElementById('add-ev-btn');
  btn.textContent='追加中...'; btn.disabled=true;
  try {
    await api({ action:'addEvent', adminId: currentAdmin.id, name, date, deadline });
    showToast('日程を追加しました ✓');
    renderAdminView();
  } catch(e) {
    alert('追加に失敗しました: '+e.message);
    btn.textContent='日程を追加する'; btn.disabled=false;
  }
}

async function adminDeleteEvent(id) {
  if (!confirm('この日程を削除しますか？')) return;
  try {
    await api({ action:'deleteEvent', id });
    showToast('削除しました');
    renderAdminView();
  } catch(e) { alert('削除に失敗しました'); }
}

async function adminDeleteMember(id) {
  if (!confirm('この参加者を削除しますか？')) return;
  try {
    await api({ action:'deleteMember', id });
    showToast('削除しました');
    renderAdminView();
  } catch(e) { alert('削除に失敗しました'); }
}

async function adminExportCSV(evId) {
  const members = await loadMembers(evId);
  const sm={attend:'参加',absent:'不参加',pending:'未回答'};
  const sb={bring:'ボトル持込あり',nobring:'持込なし'};
  const rows=[['LINE名','出欠','ボトル持込','料金','更新日時'],
    ...members.map(m=>[m.lineName,sm[m.status]||m.status,sb[m.note]||'未選択',m.pay||0,m.updatedAt||''])];
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`参加管理_${evId}.csv`; a.click();
}

// スーパー管理者ビュー
// =====================================================================
async function renderSuperAdminView() {
  document.getElementById('admin-title').textContent = 'スーパー管理者';
  const el = document.getElementById('admin-content');
  await loadAdmins();

  let adminRows = admins.map(a => `

  el.innerHTML = `
    <div class="card">
      <div class="card-eyebrow">管理者を追加</div>

      <div class="field"><label>パスワード</label><input type="password" id="new-admin-pw" placeholder="ログインパスワード"/></div>
      <button class="btn btn-verm" onclick="superAddAdmin()">管理者を追加する</button>

    <div class="card">
      <div class="card-eyebrow">管理者一覧</div>
      <div id="admin-list-wrap">${adminRows}</div>

async function superAddAdmin() {
  const name = document.getElementById('new-admin-name').value.trim();
  const pw   = document.getElementById('new-admin-pw').value;
  if (!name||!pw) { alert('名前とパスワードを入力してください'); return; }
  try {
    await api({ action:'addAdmin', superPw: SUPER_PW_LOCAL, name, password: pw });
    showToast(`${name} を追加しました ✓`);
    renderSuperAdminView();
  } catch(e) { alert('追加に失敗しました: '+e.message); }
}

async function superDeleteAdmin(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  try {
    await api({ action:'deleteAdmin', superPw: SUPER_PW_LOCAL, id });
    showToast('削除しました');
    renderSuperAdminView();
  } catch(e) { alert('削除に失敗しました: '+e.message); }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
