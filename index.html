<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>食事処えん</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1c1917;--ink-sub:#78716c;--ink-hint:#a8a29e;
  --paper:#faf8f5;--surface:#ffffff;
  --vermilion:#c0392b;--verm-bg:#fdf2f0;--verm-bd:#e8a89f;
  --moss:#3d6b47;--moss-bg:#eef4ee;--moss-bd:#93c49b;
  --gold:#92660a;--gold-bg:#fdf5e0;--gold-bd:#d4a84b;
  --border:rgba(28,25,23,0.10);--border-md:rgba(28,25,23,0.20);
  --radius:14px;--radius-sm:8px;
  --serif:'Noto Serif JP','Hiragino Mincho ProN',serif;
  --sans:'Noto Sans JP','Hiragino Sans',sans-serif;
  --shadow:0 1px 4px rgba(0,0,0,0.07);
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:430px;margin:0 auto;padding-bottom:100px;}

/* HEADER */
.header{background:var(--ink);padding:22px 20px 18px;}
.header-en{font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:4px;}
.header-ja{font-family:var(--serif);font-size:24px;color:#fff;font-weight:600;letter-spacing:0.08em;}
.header-accent{width:28px;height:2px;background:var(--vermilion);margin-top:10px;border-radius:2px;}

/* PROFILE */
.profile-bar{display:none;align-items:center;gap:12px;background:var(--surface);padding:12px 20px;border-bottom:1px solid var(--border);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--moss-bg);border:1.5px solid var(--moss-bd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--moss);flex-shrink:0;overflow:hidden;}
.avatar img{width:36px;height:36px;object-fit:cover;border-radius:50%;}
.profile-name{font-size:13px;font-weight:600;}
.profile-sub{font-size:11px;color:var(--ink-hint);}

/* TABS */
.tab-bar{display:none;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-sub);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:0.03em;}
.tab.active{color:var(--ink);border-bottom-color:var(--vermilion);}

/* SECTIONS */
.section{padding:20px 16px;display:none;}
.section.active{display:block;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-hint);margin-bottom:12px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);}
.stat-label{font-size:11px;color:var(--ink-hint);margin-bottom:6px;}
.stat-val{font-size:26px;font-weight:600;font-family:var(--serif);}
.stat-val.g{color:var(--moss);}.stat-val.r{color:var(--vermilion);}.stat-val.a{color:var(--gold);}.stat-val.b{color:#334155;}

/* FORMS */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-sub);letter-spacing:0.05em;margin-bottom:5px;}
input[type=text],input[type=password],input[type=date],input[type=number],select{
  width:100%;font-family:var(--sans);font-size:14px;
  border:1px solid var(--border-md);border-radius:var(--radius-sm);
  padding:10px 13px;background:var(--surface);color:var(--ink);
  outline:none;appearance:none;transition:border-color 0.15s,box-shadow 0.15s;
}
input:focus,select:focus{border-color:var(--vermilion);box-shadow:0 0 0 3px rgba(192,57,43,0.10);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-md);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink);transition:opacity 0.15s;letter-spacing:0.02em;}
.btn:active{opacity:0.7;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-vermilion{background:var(--vermilion);color:#fff;border-color:var(--vermilion);}
.btn-moss{background:var(--moss-bg);color:var(--moss);border-color:var(--moss-bd);}
.btn-danger{background:var(--verm-bg);color:var(--vermilion);border-color:var(--verm-bd);}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;border-radius:6px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-open{background:var(--moss-bg);color:var(--moss);}
.badge-expired{background:var(--verm-bg);color:var(--vermilion);}
.badge-attend{background:var(--moss-bg);color:var(--moss);}
.badge-absent{background:var(--verm-bg);color:var(--vermilion);}
.badge-pending{background:var(--gold-bg);color:var(--gold);}

/* EVENT CARD (member) */
.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
.ev-card-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.ev-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.ev-card-name{font-family:var(--serif);font-size:16px;font-weight:600;}
.ev-card-meta{font-size:12px;color:var(--ink-sub);}
.ev-card-body{padding:14px 16px;}

/* ANSWER BUTTONS */
.answer-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.answer-btn{padding:13px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;text-align:center;color:var(--ink-sub);transition:all 0.15s;}
.answer-btn.sel-attend{background:var(--moss-bg);border-color:var(--moss-bd);color:var(--moss);}
.answer-btn.sel-absent{background:var(--verm-bg);border-color:var(--verm-bd);color:var(--vermilion);}
.answer-btn.sel-pending{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold);}

/* PAY ROW */
.pay-row{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:var(--radius-sm);padding:10px 14px;}
.pay-row label{font-size:12px;color:var(--ink-sub);white-space:nowrap;}
.pay-row input{flex:1;max-width:120px;}
.pay-row span{font-size:13px;color:var(--ink-sub);}

/* ADMIN EVENT CARD */
.admin-ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
.admin-ev-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.admin-ev-name{font-family:var(--serif);font-size:16px;font-weight:600;}
.admin-ev-meta{font-size:12px;color:var(--ink-sub);margin-top:3px;}
.admin-ev-stats{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--paper);}
.admin-ev-stat{font-size:12px;color:var(--ink-sub);}
.admin-ev-stat b{font-weight:600;color:var(--ink);}
.member-list{padding:0 16px;}
.member-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.member-row:last-child{border-bottom:none;}
.member-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-inp{width:76px;text-align:right;font-size:12px;padding:5px 8px!important;}
.mini-sel{font-size:11px;padding:5px 6px!important;min-width:68px;}
.admin-ev-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--paper);}

/* LOCK */
.lock-screen{padding:48px 20px;text-align:center;}
.lock-icon{width:56px;height:56px;background:var(--ink);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.lock-title{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:6px;}
.lock-sub{font-size:13px;color:var(--ink-sub);margin-bottom:24px;}
.lock-screen input{max-width:260px;display:block;margin:0 auto 12px;}
.lock-screen .btn{max-width:260px;margin:0 auto;}

/* DEMO */
.demo-wrap{padding:32px 20px;}
.demo-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px;}
.demo-sub{font-size:13px;color:var(--ink-sub);margin-bottom:20px;}

/* MISC */
.expired-notice{background:var(--verm-bg);border:1px solid var(--verm-bd);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--vermilion);margin-bottom:10px;}
.loading{text-align:center;padding:48px 20px;color:var(--ink-hint);font-size:14px;}
.spinner{width:24px;height:24px;border:2px solid var(--border-md);border-top-color:var(--vermilion);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-en">Shokujidokoro</div>
    <div class="header-ja">食事処 えん</div>
    <div class="header-accent"></div>
  </div>
  <div class="profile-bar" id="profile-bar">
    <div class="avatar" id="avatar-el">？</div>
    <div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-sub">LINE でログイン済み</div>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar">
    <div class="tab active" id="tab-member" onclick="switchTab('member')">イベント一覧</div>
    <div class="tab" id="tab-admin" onclick="switchTab('admin')" style="display:none;">管理者</div>
  </div>
  <div class="section active" id="sec-member">
    <div class="loading" id="member-content"><div class="spinner"></div>読み込み中...</div>
  </div>
  <div class="section" id="sec-admin">
    <div id="admin-lock">
      <div class="lock-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">管理者ログイン</div>
        <div class="lock-sub">パスワードを入力してください</div>
        <input type="password" id="pw-inp" placeholder="パスワード"/>
        <button class="btn btn-primary" onclick="checkPw()" style="margin-top:4px;">ログイン</button>
      </div>
    </div>
    <div id="admin-main" style="display:none;">
      <div id="admin-content"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
    </div>
  </div>
</div>

<script>
// ★ 設定
const GAS_URL        = 'https://script.google.com/macros/s/AKfycbx7dIl0-Gpc64Hts0e_wnjqiwe8O6YpylRUam3jsftaYZvAD0eJI9-Y-_TF-OdOa8LcfQ/exec';
const LIFF_ID        = '2009962315-GErGmtBd';
const ADMIN_PASSWORD = 'adminpass';
const ADMIN_LINE_IDS = ['U8b7962536d1184f9c1c97e71055a9d87'];

let lineProfile = null;
let events = [];
let adminUnlocked = false;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    lineProfile = profile;
    showProfile(profile);
    if (ADMIN_LINE_IDS.includes(profile.userId)) {
      document.getElementById('tab-admin').style.display = 'block';
    }
    document.getElementById('tab-bar').style.display = 'flex';
    await loadEvents();
    renderMemberView();
  } catch(err) {
    console.warn('LIFF failed:', err.message);
    showDemoLogin();
  }
}

function showProfile(p) {
  const bar = document.getElementById('profile-bar');
  bar.style.display = 'flex';
  const av = document.getElementById('avatar-el');
  if (p.pictureUrl) {
    av.innerHTML = `<img src="${p.pictureUrl}" alt="avatar"/>`;
  } else {
    av.textContent = p.displayName.slice(0,2);
  }
  document.getElementById('profile-name').textContent = p.displayName;
}

function showDemoLogin() {
  document.getElementById('member-content').innerHTML = `
    <div class="demo-wrap">
      <div class="demo-title">ようこそ</div>
      <div class="demo-sub">お名前を入力して参加してください</div>
      <div class="field"><input type="text" id="demo-name" placeholder="例：山田 太郎"/></div>
      <button class="btn btn-primary" onclick="demoLogin()">参加する</button>
      <button class="btn" onclick="showAdminLogin()" style="margin-top:8px;">管理者として入る</button>
    </div>`;
}

function demoLogin() {
  const name = document.getElementById('demo-name').value.trim();
  if (!name) { alert('お名前を入力してください'); return; }
  lineProfile = { userId: 'demo-' + encodeURIComponent(name), displayName: name, pictureUrl: null };
  showProfile(lineProfile);
  document.getElementById('tab-bar').style.display = 'flex';
  loadEvents().then(() => renderMemberView());
}

function showAdminLogin() {
  lineProfile = { userId: 'demo-admin', displayName: '管理者', pictureUrl: null };
  showProfile(lineProfile);
  document.getElementById('tab-admin').style.display = 'block';
  document.getElementById('tab-bar').style.display = 'flex';
  switchTab('admin');
}

// API: GASはno-corsでPOSTするため、レスポンス読み取り不要
async function api(method, params) {
  if (method === 'GET') {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(`${GAS_URL}?${qs}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.data;
  } else {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(params)
    });
    return {};
  }
}

async function loadEvents() {
  try {
    const data = await api('GET', { action: 'getEvents' });
    events = Array.isArray(data) ? data : [];
  } catch(e) {
    events = [
      { id:'demo1', name:'5月の会', date:'2025-05-20', deadline:'2025-05-15' },
      { id:'demo2', name:'6月の会', date:'2025-06-10', deadline:'2025-06-30' },
    ];
  }
}

async function loadMembers(eventId) {
  try {
    const data = await api('GET', { action:'getMembers', eventId });
    return Array.isArray(data) ? data : [];
  } catch(e) { return []; }
}

function switchTab(tab) {
  ['member','admin'].forEach(t => {
    document.getElementById('sec-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  if (tab==='admin' && adminUnlocked) renderAdminView();
  if (tab==='member') renderMemberView();
}

// ---- 参加者ビュー ----
async function renderMemberView() {
  const el = document.getElementById('member-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const today = new Date().toISOString().split('T')[0];
  if (!events.length) {
    el.innerHTML = '<div class="loading">現在開催予定のイベントはありません</div>'; return;
  }
  let html = '';
  for (const ev of events) {
    const expired = ev.deadline && ev.deadline < today;
    const members = await loadMembers(ev.id);
    const me = members.find(m => m.lineUserId === lineProfile.userId);
    const myStatus = me ? me.status : '';
    const myPay = me ? (parseInt(me.pay)||0) : 0;
    html += `<div class="ev-card">
      <div class="ev-card-header">
        <div class="ev-card-top">
          <div class="ev-card-name">${esc(ev.name)}</div>
          <span class="badge ${expired?'badge-expired':'badge-open'}">${expired?'受付終了':'受付中'}</span>
        </div>
        <div class="ev-card-meta">開催日 ${ev.date}　回答期限 ${ev.deadline||'未設定'}</div>
      </div>
      <div class="ev-card-body">`;
    if (expired) {
      const label = myStatus==='attend'?'参加予定':myStatus==='absent'?'不参加':'未回答';
      html += `<div class="expired-notice">回答受付は終了しています</div>
        <div style="font-size:13px;color:var(--ink-sub);">あなたの回答: <span class="badge badge-${myStatus||'pending'}">${label}</span></div>`;
    } else {
      html += `<div class="answer-btns">
        <button class="answer-btn ${myStatus==='attend'?'sel-attend':''}" onclick="submitAnswer('${ev.id}','attend',this)">参加する</button>
        <button class="answer-btn ${myStatus==='absent'?'sel-absent':''}" onclick="submitAnswer('${ev.id}','absent',this)">不参加</button>
        <button class="answer-btn ${(!myStatus||myStatus==='pending')?'sel-pending':''}" onclick="submitAnswer('${ev.id}','pending',this)">未定</button>
      </div>
      <div class="pay-row">
        <label>支払済み金額</label>
        <input type="number" min="0" value="${myPay}" style="width:100px;" onchange="submitPay('${ev.id}',this.value)"/>
        <span>円</span>
      </div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

async function submitAnswer(evId, status, btnEl) {
  const btns = btnEl.closest('.answer-btns').querySelectorAll('.answer-btn');
  btns.forEach(b => b.className='answer-btn');
  btnEl.classList.add('sel-'+status);
  await api('POST', { action:'upsertMember', eventId:evId, lineUserId:lineProfile.userId, lineName:lineProfile.displayName, status, pay:0, note:'' }).catch(e=>console.warn(e));
}

async function submitPay(evId, val) {
  await api('POST', { action:'upsertMember', eventId:evId, lineUserId:lineProfile.userId, lineName:lineProfile.displayName, status:'pending', pay:parseInt(val)||0, note:'' }).catch(e=>console.warn(e));
}

// ---- 管理者ビュー ----
function checkPw() {
  if (document.getElementById('pw-inp').value === ADMIN_PASSWORD) {
    adminUnlocked = true;
    document.getElementById('admin-lock').style.display = 'none';
    document.getElementById('admin-main').style.display = 'block';
    renderAdminView();
  } else { alert('パスワードが違います'); }
}

async function renderAdminView() {
  const el = document.getElementById('admin-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const today = new Date().toISOString().split('T')[0];
  let ta=0,tb=0,tc=0,tp=0;
  for (const ev of events) {
    const members = await loadMembers(ev.id);
    ev._members = members;
    members.forEach(m => {
      if (m.status==='attend') ta++;
      else if (m.status==='absent') tb++;
      else tc++;
      tp += parseInt(m.pay)||0;
    });
  }
  let html = `
    <div class="stats">
      <div class="stat"><div class="stat-label">参加（累計）</div><div class="stat-val g">${ta}</div></div>
      <div class="stat"><div class="stat-label">不参加（累計）</div><div class="stat-val r">${tb}</div></div>
      <div class="stat"><div class="stat-label">未回答（累計）</div><div class="stat-val a">${tc}</div></div>
      <div class="stat"><div class="stat-label">集金合計</div><div class="stat-val b">¥${tp.toLocaleString()}</div></div>
    </div>
    <div class="card">
      <div class="card-eyebrow">日程を追加</div>
      <div class="field"><label>イベント名</label><input type="text" id="ev-name" placeholder="例: 6月の会"/></div>
      <div class="row2">
        <div class="field"><label>開催日</label><input type="date" id="ev-date"/></div>
        <div class="field"><label>回答期限</label><input type="date" id="ev-deadline"/></div>
      </div>
      <button class="btn btn-vermilion" onclick="addEvent()">日程を追加する</button>
    </div>`;

  events.forEach(ev => {
    const expired = ev.deadline && ev.deadline < today;
    const members = ev._members||[];
    const attend  = members.filter(m=>m.status==='attend').length;
    const absent  = members.filter(m=>m.status==='absent').length;
    const pending = members.filter(m=>m.status==='pending').length;
    const pay     = members.reduce((s,m)=>s+(parseInt(m.pay)||0),0);
    html += `<div class="admin-ev-card">
      <div class="admin-ev-header">
        <div>
          <div class="admin-ev-name">${esc(ev.name)}</div>
          <div class="admin-ev-meta">開催: ${ev.date}　期限: ${ev.deadline||'未設定'}</div>
        </div>
        <span class="badge ${expired?'badge-expired':'badge-open'}">${expired?'期限切れ':'受付中'}</span>
      </div>
      <div class="admin-ev-stats">
        <div class="admin-ev-stat">参加 <b style="color:var(--moss)">${attend}</b></div>
        <div class="admin-ev-stat">不参加 <b style="color:var(--vermilion)">${absent}</b></div>
        <div class="admin-ev-stat">未回答 <b style="color:var(--gold)">${pending}</b></div>
        <div class="admin-ev-stat">集金 <b>¥${pay.toLocaleString()}</b></div>
      </div>
      <div class="member-list">`;
    if (!members.length) {
      html += '<div style="padding:14px 0;font-size:13px;color:var(--ink-hint);text-align:center;">まだ参加者がいません</div>';
    } else {
      members.forEach(m => {
        html += `<div class="member-row">
          <div class="member-name">${esc(m.lineName)}</div>
          <select class="mini-sel" onchange="adminUpdateStatus('${m.id}','${ev.id}',this.value)">
            <option value="attend"  ${m.status==='attend' ?'selected':''}>参加</option>
            <option value="absent"  ${m.status==='absent' ?'selected':''}>不参加</option>
            <option value="pending" ${m.status==='pending'?'selected':''}>未回答</option>
          </select>
          <input type="number" min="0" value="${parseInt(m.pay)||0}" class="mini-inp"
            onchange="adminUpdatePay('${m.id}',this.value)"/>
          <span style="font-size:12px;color:var(--ink-hint);">円</span>
          <button class="btn btn-sm btn-danger" onclick="adminDeleteMember('${m.id}','${ev.id}')">削除</button>
        </div>`;
      });
    }
    html += `</div>
      <div class="admin-ev-footer">
        <button class="btn btn-sm btn-moss" onclick="adminExportCSV('${ev.id}')">CSV出力</button>
        <button class="btn btn-sm btn-danger" onclick="adminDeleteEvent('${ev.id}')">日程を削除</button>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

async function addEvent() {
  const name     = document.getElementById('ev-name').value.trim();
  const date     = document.getElementById('ev-date').value;
  const deadline = document.getElementById('ev-deadline').value;
  if (!name||!date) { alert('イベント名と開催日は必須です'); return; }
  try {
    await api('POST', { action:'addEvent', name, date, deadline });
    await new Promise(r=>setTimeout(r,1000));
    await loadEvents();
    renderAdminView();
  } catch(e) { alert('追加に失敗しました: '+e.message); }
}

async function adminDeleteEvent(id) {
  if (!confirm('この日程と参加者データをすべて削除しますか？')) return;
  try {
    await api('POST', { action:'deleteEvent', id });
    await new Promise(r=>setTimeout(r,1000));
    await loadEvents();
    renderAdminView();
  } catch(e) { alert('削除に失敗しました: '+e.message); }
}

async function adminUpdateStatus(mId, evId, val) {
  await api('POST', { action:'updateMember', id:mId, status:val }).catch(e=>console.warn(e));
  await new Promise(r=>setTimeout(r,800));
  await loadEvents();
  renderAdminView();
}

async function adminUpdatePay(mId, val) {
  await api('POST', { action:'updateMember', id:mId, pay:parseInt(val)||0 }).catch(e=>console.warn(e));
}

async function adminDeleteMember(mId, evId) {
  if (!confirm('この参加者を削除しますか？')) return;
  await api('POST', { action:'deleteMember', id:mId }).catch(e=>console.warn(e));
  await new Promise(r=>setTimeout(r,800));
  await loadEvents();
  renderAdminView();
}

async function adminExportCSV(evId) {
  const ev = events.find(e=>e.id===evId);
  const members = await loadMembers(evId);
  const sm = {attend:'参加',absent:'不参加',pending:'未回答'};
  const rows = [['LINE名','ステータス','支払額','更新日時'],...members.map(m=>[m.lineName,sm[m.status]||m.status,m.pay||0,m.updatedAt||''])];
  const csv = '\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `${ev?ev.name:evId}_参加管理.csv`;
  a.click();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
</body>
</html>
